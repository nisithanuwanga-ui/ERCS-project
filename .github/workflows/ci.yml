name: ERCS validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ercs_test
          POSTGRES_USER: ercs_test
          POSTGRES_PASSWORD: ci_disposable_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ercs_test -d ercs_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://ercs_test:ci_disposable_password@127.0.0.1:5432/ercs_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run build:api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - run: docker build -f deploy/backend.Dockerfile -t ercs-api .
      - run: docker build -f deploy/frontend.Dockerfile -t ercs-web .
