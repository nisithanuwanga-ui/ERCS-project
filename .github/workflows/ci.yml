name: ERCS validation
on:
  push:
    branches: [main, samhi-frontend-docker]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ercs-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Verify frontend contribution preserves backend
        if: github.head_ref == 'samhi-frontend-docker' || github.ref_name == 'samhi-frontend-docker'
        run: node ../scripts/verify-backend.mjs --portable
  containers:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FRONTEND_URL: http://127.0.0.1:8080
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
      ERCS_API_URL: http://127.0.0.1:8080/api/
      ERCS_TEST_MUTATIONS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate disposable database password
        run: echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - name: Wait for actual PostgreSQL health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/db-health; then exit 0; fi
            sleep 2
          done
          docker compose logs --no-color
          exit 1
      - run: node scripts/smoke-incidents.mjs
      - run: npm --prefix frontend ci
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - run: npm --prefix frontend run test:e2e
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop disposable stack
        if: always()
        run: docker compose down
