# Standalone file; use docker compose -f compose.external.yaml up --build -d.
# No automatic migration or database service targets your existing PostgreSQL.
name: ercs-external
services:
  backend:
    image: ercs-backend:local
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      NODE_ENV: production
      PORT: "5000"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      DATABASE_URL: ${DATABASE_URL:?Set your existing PostgreSQL connection string locally}
    init: true
    restart: unless-stopped
  frontend:
    image: ercs-frontend:local
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
